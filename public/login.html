<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechNest</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo"><a href="/" style="text-decoration:none;color:inherit"><h1>TechNest</h1></a></div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-box">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to your account</p>
            <div id="alertContainer"></div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-input">
                        <input type="password" id="password" placeholder="Enter password" required>
                        <button type="button" id="togglePassword" class="toggle-btn">👁️</button>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-group checkbox">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Remember me for 7 days</label>
                </div>

                <button type="submit" class="auth-button">
                    <span id="buttonText">Sign In</span>
                    <span id="loadingSpinner" style="display:none;"><i class="spinner"></i></span>
                </button>
            </form>

            <div class="divider"><span>Don't have an account?</span></div>
            <a href="/register" class="register-link">Create Account</a>
        </div>
    </div>

    <footer class="footer">
        <div class="container"><p>&copy; 2024 TechNest. All rights reserved.</p></div>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
