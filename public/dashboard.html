<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TechNest</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo"><h1>TechNest</h1></div>
            <div style="margin-left: auto;">
                <button onclick="logout()" class="cta-button" style="margin: 0;">Logout</button>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="#profile" class="sidebar-link active" onclick="showSection('profile')">Profile</a></li>
                <li><a href="#password" class="sidebar-link" onclick="showSection('password')">Change Password</a></li>
                <li><a href="#activity" class="sidebar-link" onclick="showSection('activity')">Activity Log</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="dashboard-header">
                <h1>Dashboard</h1>
            </div>

            <div class="dashboard-content">
                <!-- Profile Section -->
                <div id="profile" class="dashboard-section">
                    <div class="section-header">
                        <h2>User Profile</h2>
                        <button class="btn-edit" onclick="toggleEditProfile()">Edit Profile</button>
                    </div>
                    <div id="profileView" class="profile-info">
                        <div class="info-group">
                            <span class="info-label">Username</span>
                            <span class="info-value" id="displayUsername">-</span>
                        </div>
                        <div class="info-group">
                            <span class="info-label">Email</span>
                            <span class="info-value" id="displayEmail">-</span>
                        </div>
                        <div class="info-group">
                            <span class="info-label">First Name</span>
                            <span class="info-value" id="displayFirstName">-</span>
                        </div>
                        <div class="info-group">
                            <span class="info-label">Last Name</span>
                            <span class="info-value" id="displayLastName">-</span>
                        </div>
                        <div class="info-group">
                            <span class="info-label">Phone</span>
                            <span class="info-value" id="displayPhone">-</span>
                        </div>
                        <div class="info-group">
                            <span class="info-label">City</span>
                            <span class="info-value" id="displayCity">-</span>
                        </div>
                        <div class="info-group">
                            <span class="info-label">Country</span>
                            <span class="info-value" id="displayCountry">-</span>
                        </div>
                        <div class="info-group">
                            <span class="info-label">Member Since</span>
                            <span class="info-value" id="displayCreated">-</span>
                        </div>
                    </div>

                    <form id="editProfileForm" class="edit-form" style="display: none;">
                        <div class="form-group"><label>First Name</label><input type="text" id="editFirstName"></div>
                        <div class="form-group"><label>Last Name</label><input type="text" id="editLastName"></div>
                        <div class="form-group"><label>Phone</label><input type="tel" id="editPhone"></div>
                        <div class="form-group full"><label>Address</label><input type="text" id="editAddress"></div>
                        <div class="form-group"><label>City</label><input type="text" id="editCity"></div>
                        <div class="form-group"><label>State</label><input type="text" id="editState"></div>
                        <div class="form-group"><label>Postal Code</label><input type="text" id="editPostalCode"></div>
                        <div class="form-group"><label>Country</label><input type="text" id="editCountry"></div>
                        <div class="form-actions">
                            <button type="submit" class="btn-save">Save Changes</button>
                            <button type="button" class="btn-cancel" onclick="toggleEditProfile()">Cancel</button>
                        </div>
                    </form>
                </div>

                <!-- Password Section -->
                <div id="password" class="dashboard-section" style="display: none;">
                    <div class="section-header"><h2>Change Password</h2></div>
                    <form id="passwordForm" class="edit-form" style="max-width: 400px;">
                        <div class="form-group full">
                            <label>Current Password</label>
                            <input type="password" id="currentPassword" required>
                        </div>
                        <div class="form-group full">
                            <label>New Password</label>
                            <input type="password" id="newPassword" required>
                        </div>
                        <div class="form-group full">
                            <label>Confirm Password</label>
                            <input type="password" id="confirmNewPassword" required>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-save">Change Password</button>
                        </div>
                    </form>
                </div>

                <!-- Activity Log Section -->
                <div id="activity" class="dashboard-section" style="display: none;">
                    <div class="section-header"><h2>Activity Log</h2></div>
                    <ul id="activityList" class="activity-log">
                        <li class="activity-item"><span>Loading...</span></li>
                    </ul>
                </div>
            </div>
        </main>
    </div>

    <footer class="footer">
        <div class="container"><p>&copy; 2024 TechNest. All rights reserved.</p></div>
    </footer>

    <script>
        // Check authentication
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login';
                return;
            }
            await loadProfile();
        });

        async function loadProfile() {
            try {
                const response = await fetch('/api/user/profile', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                if (!response.ok) throw new Error('Failed to load profile');
                
                const data = await response.json();
                const user = data.user;
                
                document.getElementById('displayUsername').textContent = user.username;
                document.getElementById('displayEmail').textContent = user.email;
                document.getElementById('displayFirstName').textContent = user.firstName || '-';
                document.getElementById('displayLastName').textContent = user.lastName || '-';
                document.getElementById('displayPhone').textContent = user.phone || '-';
                document.getElementById('displayCity').textContent = user.city || '-';
                document.getElementById('displayCountry').textContent = user.country || '-';
                document.getElementById('displayCreated').textContent = new Date(user.createdAt).toLocaleDateString();
                
                document.getElementById('editFirstName').value = user.firstName || '';
                document.getElementById('editLastName').value = user.lastName || '';
                document.getElementById('editPhone').value = user.phone || '';
                document.getElementById('editCity').value = user.city || '';
                document.getElementById('editCountry').value = user.country || '';
                
                loadActivityLog();
            } catch (err) {
                alert('Failed to load profile: ' + err.message);
            }
        }

        async function loadActivityLog() {
            try {
                const response = await fetch('/api/user/activity-log', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                if (!response.ok) throw new Error('Failed to load activity');
                
                const data = await response.json();
                const activityList = document.getElementById('activityList');
                
                if (data.logs.length === 0) {
                    activityList.innerHTML = '<li class="activity-item"><span>No activity yet</span></li>';
                    return;
                }
                
                activityList.innerHTML = data.logs.map(log => `
                    <li class="activity-item">
                        <div>
                            <span class="activity-action">${log.action}</span>
                            <span class="activity-details">${log.ipAddress}</span>
                        </div>
                        <span class="activity-time">${new Date(log.createdAt).toLocaleString()}</span>
                    </li>
                `).join('');
            } catch (err) {
                console.error('Activity log error:', err);
            }
        }

        function showSection(section) {
            document.querySelectorAll('.dashboard-section').forEach(el => el.style.display = 'none');
            document.getElementById(section).style.display = 'block';
            document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
        }

        function toggleEditProfile() {
            document.getElementById('profileView').style.display = 
                document.getElementById('profileView').style.display === 'none' ? 'grid' : 'none';
            document.getElementById('editProfileForm').style.display = 
                document.getElementById('editProfileForm').style.display === 'none' ? 'grid' : 'none';
        }

        document.getElementById('editProfileForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const response = await fetch('/api/user/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({
                        firstName: document.getElementById('editFirstName').value,
                        lastName: document.getElementById('editLastName').value,
                        phone: document.getElementById('editPhone').value,
                        address: document.getElementById('editAddress').value,
                        city: document.getElementById('editCity').value,
                        state: document.getElementById('editState').value,
                        postalCode: document.getElementById('editPostalCode').value,
                        country: document.getElementById('editCountry').value
                    })
                });
                if (response.ok) {
                    alert('Profile updated successfully');
                    toggleEditProfile();
                    loadProfile();
                } else {
                    alert('Failed to update profile');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });

        document.getElementById('passwordForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (document.getElementById('newPassword').value !== document.getElementById('confirmNewPassword').value) {
                alert('Passwords do not match');
                return;
            }
            try {
                const response = await fetch('/api/user/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({
                        currentPassword: document.getElementById('currentPassword').value,
                        newPassword: document.getElementById('newPassword').value
                    })
                });
                if (response.ok) {
                    alert('Password changed successfully');
                    e.target.reset();
                } else {
                    alert('Failed to change password');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });

        async function logout() {
            try {
                await fetch('/api/auth/logout', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
            } finally {
                localStorage.removeItem('token');
                window.location.href = '/';
            }
        }
    </script>
</body>
</html>
